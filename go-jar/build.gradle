plugins { id 'java' }

base { archivesName = 'go' }
version = rootProject.mod_version

java { toolchain { languageVersion = JavaLanguageVersion.of(25) } }

tasks.withType(JavaCompile).configureEach {
	options.release = 25
	options.encoding = 'UTF-8'
}

// go.jar has no dependencies and is stamped with its version so it can self-describe.
jar {
	archiveFileName = 'go.jar'
	manifest {
		attributes 'Main-Class': 'com.go.craft.gojar.Main',
			'Implementation-Version': project.version
	}
}
