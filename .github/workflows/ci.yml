name: CI

on:
  push:
  pull_request:

jobs:
  # Runs the real game on each OS. This is the only way to know the native bridge works there.
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { path: gocraft }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/gocraft-sdk", path: gocraft-sdk }
      - uses: actions/checkout@v4
        with: { repository: "${{ github.repository_owner }}/gocraft-example", path: gocraft-example }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "25" }
      - uses: actions/setup-go@v5
        with: { go-version: "1.26" }
      - name: Integration test
        shell: bash
        run: gocraft/scripts/integration-test.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: logs-${{ matrix.os }}
          path: gocraft/build/it-run/it.log
